<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Post Details</title>
    <link href="../public/css/styles.css" th:href="@{/css/styles.css}" rel="stylesheet"/>
</head>
<body>

<div th:replace="~{fragments :: navbar}"></div>

<div class="singlePost">
    <h1 th:text="${postAndComment.post.title}">Post Title</h1>
    <p th:text="${postAndComment.post.message}">Post content</p>
    <small>Posted by: <span th:text="${postAndComment.post.authorName}">Author</span></small>
    <small th:text="${postAndComment.post.relativeTime}">timestamp</small>
</div>

<hr>

<div class="comments">
    <h2>Comments</h2>
    <div th:if="${postAndComment.comments != null and #lists.size(postAndComment.comments) > 0}">
        <div th:each="comment : ${postAndComment.comments}">
            <p><strong th:text="${comment.authorName}">Author</strong></p>
            <p th:text="${comment.content}">Comment content</p>
            <p><small th:text="${comment.relativeTime}">timestamp</small></p>
            <hr>
        </div>
    </div>
    <div th:if="${postAndComment.comments == null or #lists.size(postAndComment.comments) == 0}">
        <p>No comments yet. Be the first to comment!</p>
    </div>
</div>

<hr>

<div class="add-comment">
    <form th:action="@{/post/{id}/comment(id=${postAndComment.post.postId})}" method="post">
        <label for="body">Add Comment</label><br>
        <textarea id="body" name="body" rows="2" required></textarea><br>
        <button type="submit">Post Comment</button>
    </form>
</div>

</body>
</html>
