<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link href="../public/css/styles.css" th:href="@{/css/styles.css}" rel="stylesheet"/>
    <title>Opret indlæg</title>
</head>
<body>
<div th:replace="~{fragments :: navigation}"></div>
<main class="content-container">

<div class="form-container">
    <h1>Opret et nyt indlæg</h1>
<form th:action="@{/createPost}" method="post" enctype="multipart/form-data">

    <label for="title">Titel</label>
    <input type="text" id="title" name="title" placeholder="Indtast en titel" required>

    <label for="body">Brødtekst</label>
    <textarea id="body" name="body" placeholder="Skriv dit indlæg her..." rows="6" required></textarea>

    <label for="image">Billede (valgfrit)</label>
    <input type="file" id="image" name="image" accept="image/*">

    <button type="submit">Opret indlæg</button>
</form>
</div>
</main>
<div th:replace="~{fragments :: footer}"></div>
</body>
</html>
